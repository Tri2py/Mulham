    <style>
        /* === Root Wrapper === */
        #loader-wrapper {
            position: fixed;
            inset: 0;
            z-index: 9999999;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            pointer-events: all;
            user-select: none;
            background: transparent;
        }

        /* === Theatrical Curtains === */
        .loader-curtain {
            position: absolute;
            top: 0;
            width: 50.5%;
            height: 100%;
            background: #06020A;
            z-index: 100000;
            transition: transform 0.85s cubic-bezier(0.77, 0, 0.175, 1);
            will-change: transform;
        }
        .loader-curtain--left {
            left: 0;
            border-right: 1px solid rgba(140, 45, 246, 0.18);
        }
        .loader-curtain--right {
            right: 0;
            border-left: 1px solid rgba(140, 45, 246, 0.18);
        }
        .loaded .loader-curtain--left {
            transform: translateX(-101%);
        }
        .loaded .loader-curtain--right {
            transform: translateX(101%);
        }

        /* Ambient Glow */
        .loader-ambient-glow {
            position: absolute;
            width: 340px;
            height: 340px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(140, 45, 246, 0.22) 0%, rgba(140, 45, 246, 0.04) 50%, transparent 70%);
            z-index: 100001;
            pointer-events: none;
            filter: blur(50px);
            animation: monogramGlowPulse 2s ease-in-out infinite alternate;
        }

        /* === Center Brand Stage === */
        #loader-content {
            position: relative;
            z-index: 100002;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 14px;
            transition: opacity 0.45s cubic-bezier(0.4, 0, 0.2, 1), transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .loaded #loader-content {
            opacity: 0;
            transform: scale(0.92) translateY(-14px);
        }

        /* === SVG Monogram Stroke Animation === */
        .loader-svg-wrap {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 2px;
        }
        .loader-monogram-svg {
            display: block;
            overflow: visible;
        }

            stroke-dashoffset: 220;

        }
        .m-dot {
            opacity: 0;
            transform: scale(0);
            transform-origin: 37px 54px;
            animation: dotPopIn 0.4s 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        /* === Typography Line === */
        .loader-brand {
            display: flex;
            align-items: center;
            gap: 8px;

            width: 3px;
            height: 3px;
            border-radius: 50%;
            background: #8C2DF6;
            display: inline-block;
        }
        .loader-brand-role {
            color: rgba(255, 255, 255, 0.4);
            font-weight: 400;
        }

        /* === Numeric Counter === */
        .loader-counter-wrap {
            font-family: 'Inter', -apple-system, monospace;
            font-size: 1.05rem;
            font-weight: 300;
            letter-spacing: 0.08em;
            color: #ffffff;
            margin-top: 2px;
            display: flex;
            align-items: baseline;
            gap: 1px;
            font-variant-numeric: tabular-nums;
        }

            color: #ffffff;
        }
        .loader-counter-pct {

        }

        /* === Progress Hairline === */
        .loader-progress-wrap {
            width: 120px;
            height: 1.5px;
            background: rgba(255, 255, 255, 0.08);

            overflow: hidden;

            left: 0;
            height: 100%;
            width: 0%;

            border-radius: 99px;
            transition: width 0.08s linear;

    <script>
        (function() {
            var counterElem = document.getElementById('loaderCounterNumber');
            var progressElem = document.getElementById('loaderProgressFill');
            var currentPercent = 0;
            var targetPercent = 100;
            var isFinished = false;

            // Smooth numeric counter animation
            var counterInterval = setInterval(function() {
                if (currentPercent < 90) {
                    currentPercent += Math.floor(Math.random() * 6) + 3;
                    if (currentPercent > 90) currentPercent = 90;
                } else if (isFinished && currentPercent < 100) {
                    currentPercent += 2;
                }

                if (currentPercent > 100) currentPercent = 100;

                if (counterElem) {
                    counterElem.textContent = currentPercent < 10 ? '0' + currentPercent : currentPercent;
                }
                if (progressElem) {
                    progressElem.style.width = currentPercent + '%';
                }

                if (currentPercent >= 100) {
                    clearInterval(counterInterval);
                    setTimeout(dismissPreloader, 180);
                }
            }, 32);

            function dismissPreloader() {
                if (!document.body.classList.contains('loaded')) {
                    document.body.classList.add('loaded');
                }
            }

            function triggerFinish() {
                isFinished = true;
                // Rapidly complete counter to 100%
                var finishFast = setInterval(function() {
                    currentPercent += 5;
                    if (currentPercent >= 100) {
                        currentPercent = 100;
                        clearInterval(finishFast);
                        if (counterElem) counterElem.textContent = '100';
                        if (progressElem) progressElem.style.width = '100%';
                        setTimeout(dismissPreloader, 200);
                    } else {
                        if (counterElem) counterElem.textContent = currentPercent < 10 ? '0' + currentPercent : currentPercent;
                        if (progressElem) progressElem.style.width = currentPercent + '%';
                    }
                }, 20);
            }

            if (document.readyState === 'complete') {
                setTimeout(triggerFinish, 600);
            } else {
                window.addEventListener('load', function() {
                    setTimeout(triggerFinish, 600);
                });
            }

            // Fallback safety timeout so user is never stalled
            setTimeout(triggerFinish, 2800);
        })();

    <script>
        let markdownContent = '';
        let jsCodeContent = '';

        // Convert markdown to JavaScript code format
        function markdownToJavaScriptCode(markdown) {
            const lines = markdown.split('\n');
            let jsCode = '<span class="comment">// ========================================</span>\n';
            jsCode += '<span class="comment">// MULHAM IBRAHIM - Curriculum Vitae</span>\n';
            jsCode += '<span class="comment">// Digital Marketing Strategist | Front-End Developer | Founder</span>\n';
            jsCode += '<span class="comment">// ========================================</span>\n\n';

            jsCode += '<span class="keyword">const</span> <span class="variable">mulhamIbrahim</span> <span class="operator">=</span> <span class="bracket">{</span>\n\n';

            let inSection = false;
            let currentSection = '';

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();

                if (line.startsWith('# ')) {
                    // Main title
                    const title = line.substring(2);
                    jsCode += `    <span class="comment">// ${title}</span>\n`;
                } else if (line.startsWith('## ')) {
                    // Section header
                    const section = line.substring(3);
                    if (currentSection) {
                        jsCode += `    <span class="bracket">}</span><span class="punctuation">,</span>\n\n`;
                    }
                    jsCode += `    <span class="property">${section.toLowerCase().replace(/\s+/g, '')}</span><span class="punctuation">:</span> <span class="bracket">{</span>\n`;
                    currentSection = section.toLowerCase().replace(/\s+/g, '');
                } else if (line.startsWith('### ')) {
                    // Subsection
                    const subsection = line.substring(4);
                    jsCode += `        <span class="property">${subsection.toLowerCase().replace(/\s+/g, '')}</span><span class="punctuation">:</span> <span class="string">"${subsection}"</span><span class="punctuation">,</span>\n`;
                } else if (line.startsWith('- **') || line.startsWith('- ')) {
                    // List item
                    let content = line.replace(/^-\s*\*\*/, '').replace(/\*\*:/, ':').replace(/\*\*/g, '');
                    if (content.includes(':')) {
                        const [key, value] = content.split(':').map(s => s.trim());
                        jsCode += `        <span class="property">${key.toLowerCase().replace(/\s+/g, '')}</span><span class="punctuation">:</span> <span class="string">"${value}"</span><span class="punctuation">,</span>\n`;
                    } else {
                        content = content.replace(/^-\s*/, '');
                        jsCode += `        <span class="string">"${content}"</span><span class="punctuation">,</span>\n`;
                    }
                } else if (line.startsWith('**') && line.includes('**')) {
                    // Bold text
                    const boldText = line.replace(/\*\*/g, '');
                    jsCode += `        <span class="string">"${boldText}"</span><span class="punctuation">,</span>\n`;
                } else if (line && !line.startsWith('---')) {
                    // Regular text
                    const cleanLine = line.replace(/\*\*/g, '').replace(/\[([^\]]+)\]\([^\)]+\)/g, '$1');
                    if (cleanLine.trim()) {
                        jsCode += `        <span class="string">"${cleanLine}"</span><span class="punctuation">,</span>\n`;
                    }
                }
            }

            if (currentSection) {
                jsCode += `    <span class="bracket">}</span>\n`;
            }

            jsCode += '<span class="bracket">}</span><span class="punctuation">;</span>\n\n';
            jsCode += '<span class="comment">// Export for potential use</span>\n';
            jsCode += '<span class="keyword">export default</span> <span class="variable">mulhamIbrahim</span><span class="punctuation">;</span>';

            return jsCode;
        }

        // Convert markdown to JavaScript code format
        function convertMarkdownToJS(markdown) {
            let jsCode = '<span class="comment">// ========================================</span>\n';
            jsCode += '<span class="comment">// MULHAM IBRAHIM - Curriculum Vitae</span>\n';
            jsCode += '<span class="comment">// Digital Marketing Strategist | Front-End Developer | Founder</span>\n';
            jsCode += '<span class="comment">// ========================================</span>\n\n';

            jsCode += '<span class="keyword">const</span> <span class="variable">mulhamIbrahim</span> <span class="operator">=</span> <span class="bracket">{</span>\n\n';

            const lines = markdown.split('\n');
            let inSection = false;
            let currentSection = '';
            let sectionContent = [];

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i];
                const trimmed = line.trim();

                // Skip horizontal rules
                if (trimmed === '---' || trimmed === '') {
                    continue;
                }

                // Main title
                if (trimmed.startsWith('# ')) {
                    const title = trimmed.substring(2);
                    jsCode += `    <span class="comment">// ${title}</span>\n`;
                }
                // Section headers (##)
                else if (trimmed.startsWith('## ')) {
                    if (inSection && currentSection) {
                        // Close previous section
                        if (sectionContent.length > 0) {
                            jsCode += `        <span class="property">items</span><span class="punctuation">:</span> <span class="bracket">[</span>\n`;
                            sectionContent.forEach(item => {
                                const escaped = item.replace(/"/g, '\\"');
                                jsCode += `            <span class="string">"${escaped}"</span><span class="punctuation">,</span>\n`;
                            });
                            jsCode += `        <span class="bracket">]</span><span class="punctuation">,</span>\n`;
                        }
                        jsCode += `    <span class="bracket">}</span><span class="punctuation">,</span>\n\n`;
                    }

                    currentSection = trimmed.substring(3).trim();
                    const propName = currentSection.toLowerCase().replace(/[^a-z0-9]/g, '');
                    jsCode += `    <span class="property">${propName}</span><span class="punctuation">:</span> <span class="bracket">{</span>\n`;
                    jsCode += `        <span class="property">title</span><span class="punctuation">:</span> <span class="string">"${currentSection}"</span><span class="punctuation">,</span>\n`;
                    inSection = true;
                    sectionContent = [];
                }
                // Subsection headers (###)
                else if (trimmed.startsWith('### ')) {
                    const subsection = trimmed.substring(4).replace(/\*\*/g, '').trim();
                    jsCode += `        <span class="property">subsection</span><span class="punctuation">:</span> <span class="string">"${subsection.replace(/"/g, '\\"')}"</span><span class="punctuation">,</span>\n`;
                }
                // List items
                else if (trimmed.startsWith('- ')) {
                    let content = trimmed.substring(2);
                    // Remove markdown formatting
                    content = content.replace(/\*\*/g, '').replace(/\*/g, '');
                    // Handle links
                    content = content.replace(/\[([^\]]+)\]\([^\)]+\)/g, '$1');
                    content = content.replace(/"/g, '\\"');
                    sectionContent.push(content);
                }
                // Regular text (not empty)
                else if (trimmed) {
                    let content = trimmed;
                    // Remove markdown formatting
                    content = content.replace(/\*\*/g, '').replace(/\*/g, '');
                    content = content.replace(/\[([^\]]+)\]\([^\)]+\)/g, '$1');
                    content = content.replace(/"/g, '\\"');
                    sectionContent.push(content);
                }
            }

            // Close last section
            if (inSection && currentSection) {
                if (sectionContent.length > 0) {
                    jsCode += `        <span class="property">items</span><span class="punctuation">:</span> <span class="bracket">[</span>\n`;
                    sectionContent.forEach(item => {
                        jsCode += `            <span class="string">"${item}"</span><span class="punctuation">,</span>\n`;
                    });
                    jsCode += `        <span class="bracket">]</span><span class="punctuation">,</span>\n`;
                }
                jsCode += `    <span class="bracket">}</span><span class="punctuation">,</span>\n\n`;
            }

            jsCode += '<span class="bracket">}</span><span class="punctuation">;</span>\n\n';
            jsCode += '<span class="comment">// Export for potential use</span>\n';
            jsCode += '<span class="keyword">export default</span> <span class="variable">mulhamIbrahim</span><span class="punctuation">;</span>';

            return jsCode;
        }

        // Load markdown file and convert to JavaScript code
        async function loadCV() {
            try {
                const response = await fetch('mulham_ibrahim_cv.md');
                if (!response.ok) {
                    throw new Error('Failed to load CV file');
                }
                markdownContent = await response.text();

                // Convert markdown to JavaScript code format
                jsCodeContent = convertMarkdownToJS(markdownContent);

                // Display the code
                const codeContent = document.getElementById('codeContent');
                codeContent.innerHTML = jsCodeContent;

                // Generate line numbers
                updateLineNumbers();

                // Enable run button
                document.getElementById('runBtn').disabled = false;
            } catch (error) {
                console.error('Error loading CV:', error);
                document.getElementById('codeContent').innerHTML =
                    '<span class="comment">// Error loading CV file</span>\n' +
                    `<span class="comment">// ${error.message}</span>`;
            }
        }

        // Update line numbers
        function updateLineNumbers() {
            const codeContent = document.getElementById('codeContent');
            const lineNumbers = document.getElementById('lineNumbers');
            lineNumbers.innerHTML = '';

            // Count lines (approximate)
            const text = codeContent.innerText || codeContent.textContent;
            const lines = text.split('\n');

            for (let i = 1; i <= lines.length; i++) {
                const lineNum = document.createElement('div');
                lineNum.className = 'line-number';
                lineNum.textContent = i;
                lineNumbers.appendChild(lineNum);
            }
        }

        // Convert markdown to formatted text for PDF
        function formatMarkdownForPDF(markdown) {
            const lines = markdown.split('\n');
            const formatted = [];

            for (let line of lines) {
                const trimmed = line.trim();

                if (trimmed === '---' || trimmed === '') {
                    formatted.push('');
                    continue;
                }

                if (trimmed.startsWith('# ')) {
                    // Main title
                    formatted.push(trimmed.substring(2).replace(/\*\*/g, ''));
                    formatted.push('');
                } else if (trimmed.startsWith('## ')) {
                    // Section header
                    formatted.push('');
                    formatted.push(trimmed.substring(3).replace(/\*\*/g, ''));
                    formatted.push('');
                } else if (trimmed.startsWith('### ')) {
                    // Subsection
                    formatted.push(trimmed.substring(4).replace(/\*\*/g, ''));
                } else if (trimmed.startsWith('- ')) {
                    // List item
                    let content = trimmed.substring(2);
                    content = content.replace(/\*\*/g, '');
                    content = content.replace(/\[([^\]]+)\]\([^\)]+\)/g, '$1');
                    formatted.push('  • ' + content);
                } else if (trimmed) {
                    // Regular text
                    let content = trimmed;
                    content = content.replace(/\*\*/g, '');
                    content = content.replace(/\[([^\]]+)\]\([^\)]+\)/g, '$1');
                    formatted.push(content);
                }
            }

            return formatted.join('\n');
        }

        // Download CV as PDF
        async function downloadCVAsPDF() {
            if (!markdownContent) {
                alert('CV content not loaded yet. Please wait...');
                return;
            }

            try {
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF();

                // Set font
                doc.setFont('helvetica');
                doc.setFontSize(11);

                // Format markdown for PDF
                const formattedText = formatMarkdownForPDF(markdownContent);

                // Split text into lines that fit the page
                const maxWidth = 180; // mm
                const lines = doc.splitTextToSize(formattedText, maxWidth);

                let y = 20;
                const lineHeight = 6;
                const pageHeight = 280;
                const margin = 15;

                // Process each line
                for (let i = 0; i < lines.length; i++) {
                    const line = lines[i];

                    // Check if we need a new page
                    if (y > pageHeight - 10) {
                        doc.addPage();
                        y = 20;
                    }

                    // Check if this is a header (starts with uppercase and no bullet)
                    if (line.trim() && !line.trim().startsWith('•') &&
                        line === line.toUpperCase() && line.length < 50) {
                        doc.setFontSize(14);
                        doc.setFont('helvetica', 'bold');
                        y += 3;
                    } else if (line.trim().startsWith('•')) {
                        doc.setFontSize(10);
                        doc.setFont('helvetica', 'normal');
                    } else {
                        doc.setFontSize(11);
                        doc.setFont('helvetica', 'normal');
                    }

                    doc.text(line, margin, y);
                    y += lineHeight;
                }

                // Save PDF
                doc.save('Mulham_Ibrahim_CV.pdf');
            } catch (error) {
                console.error('Error generating PDF:', error);
                alert('Error generating PDF. Please try again.');
            }
        }

        // Load CV when page loads
        window.addEventListener('DOMContentLoaded', loadCV);
    </script>

    <script>

            const targets = document.querySelectorAll(".bringer-block, .bringer-timeline-item, .cv-preview-section");
            targets.forEach(function(el) { el.classList.add("reveal-on-scroll"); });
            const obs = new IntersectionObserver(function(entries, observer) {
                entries.forEach(function(entry) {
                    if (entry.isIntersecting) {
                        entry.target.classList.add("is-visible");
                        observer.unobserve(entry.target);
                    }
                });
            }, { threshold: 0.1, rootMargin: "0px 0px -30px 0px" });
            targets.forEach(function(el) { obs.observe(el); });
        });
